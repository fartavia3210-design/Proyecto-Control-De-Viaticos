name: Validar proyecto completo
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    paths:
      - 'ControlViaticos/**'
      - 'ControlViaticos.sln'
      - 'tests/**'
      - '.github/workflows/liquidaciones.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Compilar aplicación .NET Framework
        run: msbuild ControlViaticos.sln /p:Configuration=Release /verbosity:minimal
      - name: Comprobar lógica y formularios
        shell: powershell
        run: ./tests/Run-Regression.ps1
      - name: Capturar módulos y tamaños de ventana
        shell: powershell
        run: ./tests/Capture-Comparison.ps1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: revision-visual-final
          path: screenshots/*.png
